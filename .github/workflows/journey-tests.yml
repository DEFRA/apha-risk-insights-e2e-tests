name: Run Journey Tests on GitHub

# Runs the whole suite against main of every service. Start it by hand, or call
# it from another workflow, e.g. on a schedule.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      playwright-args:
        description: Extra arguments for `playwright test`, e.g. `--grep @smoke`
        type: string
        required: false
        default: ''

jobs:
  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - uses: DEFRA/apha-risk-insights-e2e-tests/run-journey-tests@main
        with:
          playwright-args: ${{ inputs.playwright-args }}
