name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  journey-tests:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    # id-token lets the journey tests log in to Docker Hub through this repo's
    # CDP build role, avoiding Docker Hub's rate limits on anonymous pulls
    permissions:
      contents: read
      id-token: write
    steps:
      # Check out this repo so the action below runs from the pull request,
      # not main. The action checks out every repo it needs itself
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./run-journey-tests
