name: Run Journey Tests on GitHub
description: Starts the services with docker compose and runs the Playwright BDD suite

inputs:
  apha-risk-insights-backend:
    description: Backend image tag to test (defaults to latest)
    required: false
  apha-risk-insights-frontend:
    description: Frontend image tag to test (defaults to latest)
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/apha-risk-insights-e2e-tests

    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm ci
      shell: bash
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      shell: bash
    - name: Start docker compose
      shell: bash
      run: |
          APHA_RISK_INSIGHTS_FRONTEND=${{inputs.apha-risk-insights-frontend}} \
          APHA_RISK_INSIGHTS_BACKEND=${{inputs.apha-risk-insights-backend}} \
          docker compose up --wait --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      run: npm run test:github
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./playwright-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
