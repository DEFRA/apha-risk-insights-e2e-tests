################################################################################
# Docker Compose file for starting up the services under test in a GitHub
# workflow. It provides comparable infrastructure to the real environment:
#   - mongodb (backend data store)
#   - redis (frontend session cache, when enabled)
#   - localstack (s3, sqs, sns)
#
# Playwright runs its browsers inside the test process, so no browser container
# is needed here (unlike the previous Selenium/WebdriverIO setup).
#
# The e2e tests run on the GitHub runner host and reach these services through
# their published ports (localhost:3000 / localhost:3001), which is what
# `npm run test:github` targets.
################################################################################
services:
  ################################################################################
  mongodb:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  localstack:
    image: localstack/localstack:3.2.0
    environment:
      - LOCALSTACK_HOST=127.0.0.1
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./docker/config/defaults.env
    volumes:
      - ./docker/scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3

  ################################################################################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'PING']
      interval: 5s
      start_period: 2s
      retries: 5

  ################################################################################
  # Backend API under test.
  apha-risk-insights-backend:
    image: defradigital/apha-risk-insights-backend:${APHA_RISK_INSIGHTS_BACKEND:-latest}
    env_file:
      - ./docker/config/defaults.env
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DATABASE=apha-risk-insights-backend
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 3s
      start_period: 5s
      retries: 5

  ################################################################################
  # Frontend service under test. Uses an in-memory session cache for e2e runs.
  apha-risk-insights-frontend:
    image: defradigital/apha-risk-insights-frontend:${APHA_RISK_INSIGHTS_FRONTEND:-latest}
    env_file:
      - ./docker/config/defaults.env
    environment:
      - PORT=3000
      - SESSION_CACHE_ENGINE=memory
    depends_on:
      redis:
        condition: service_healthy
      apha-risk-insights-backend:
        condition: service_started
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 3s
      start_period: 5s
      retries: 5
