# BrowserStack configuration for the Playwright SDK.
#
# Run with:
#   npm run test:browserstack          (from the CDP portal)
#   npm run test:github:browserstack   (from a GitHub runner)
#
# Credentials are read from the environment (never commit them):
#   BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY
userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: APHA Risk Insights
buildName: apha-risk-insights-e2e
buildIdentifier: '#${BUILD_NUMBER}'

# Browsers / platforms to run the suite against.
platforms:
  - os: Windows
    osVersion: 11
    browserName: chrome
    browserVersion: latest
  - os: OSX
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest

parallelsPerPlatform: 1

# Tunnel BrowserStack back to the services under test (localhost / CDP network).
browserstackLocal: true

# Capture artefacts to aid debugging.
debug: true
networkLogs: true
consoleLogs: errors
